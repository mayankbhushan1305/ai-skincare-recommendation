<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Type Quiz - GlowAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; color: #333;
        }
        .container {
            max-width: 650px; margin: 0 auto; padding: 20px;
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center;
        }
        .quiz-container {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            border-radius: 30px; padding: 40px 50px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3); position: relative; overflow: hidden;
        }
        .quiz-container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, #ff9a9e, #fecfef, #fecfef, #ff9a9e);
            background-size: 200% 100%; animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; } 100% { background-position: -200% 0; }
        }
        .quiz-title {
            text-align: center; color: #333; margin-bottom: 35px;
        }
        .quiz-title h1 {
            font-size: 2.2rem; font-weight: 700; margin-bottom: 8px; color: #764ba2;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .quiz-title p {
            font-size: 1rem; color: #666; font-weight: 300;
        }
        .form-group { margin-bottom: 25px; }
        .form-group label.question-label {
            display: block; font-weight: 600; color: #333; margin-bottom: 12px; font-size: 1.05rem;
        }
        .radio-option {
            display: flex; align-items: center; gap: 12px; padding: 15px 20px;
            background: #faf8ff; border: 2px solid #eee; border-radius: 15px;
            cursor: pointer; transition: all 0.3s ease; margin-bottom: 8px;
            font-family: 'Poppins', sans-serif; font-size: 0.95krem; color: #555;
        }
        .radio-option:hover {
            border-color: #667eea; background: #f0f4ff; transform: translateX(3px);
        }
        .radio-option input[type="radio"] {
            width: 18px; height: 18px; accent-color: #667eea; cursor: pointer;
        }
        .submit-btn {
            width: 100%; padding: 18px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 20px; font-size: 1.1rem; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3); margin-top: 20px;
        }
        .submit-btn:hover {
            transform: translateY(-2px); box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }
        .result-section {
            margin-top: 20px; padding: 25px; background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
            border-radius: 20px; text-align: center; border: 2px solid #e8e8e8; animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-section h2 {
            font-size: 1.4rem; margin-bottom: 12px; color: #764ba2;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .result-skin-type {
            font-size: 1.5rem; font-weight: 700; color: #333; margin: 15px 0;
            padding: 15px; background: #fff; border-radius: 15px;
            border: 2px solid rgba(118, 75, 162, 0.2);
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 25px;
            border-radius: 20px; text-decoration: none; font-weight: 600; font-size: 0.95rem;
            transition: all 0.3s ease; margin-top: 15px; box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        .back-btn:hover {
            transform: translateY(-2px); box-shadow: 0 12px 25px rgba(102, 126, 234, 0.4);
        }
        .form-wrapper { transition: all 0.5s ease; }
        .has-results .form-wrapper { display: none; }
        .has-results .quiz-title { display: none; }
        
        @media (max-width: 768px) {
            .quiz-container { padding: 30px 20px; margin: 20px; }
            .quiz-title h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quiz-container {% if result %}has-results{% endif %}">
            <div class="quiz-title">
                <h1><i class="fas fa-dna"></i> Skin Type Quiz</h1>
                <p>Answer these 3 quick questions to discover your skin type!</p>
            </div>

            <div class="form-wrapper">
                <form method="POST">
                    <div class="form-group">
                        <label class="question-label"><i class="fas fa-oil-can" style="color:#667eea;"></i> Does your skin feel oily or shiny, especially in the T-zone?</label>
                        <label class="radio-option">
                            <input type="radio" name="oiliness" value="yes" required>
                            <span>✅ Yes, often</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="oiliness" value="no">
                            <span>❌ No, usually not</span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label class="question-label"><i class="fas fa-snowflake" style="color:#f5576c;"></i> Does your skin feel tight, dry, or flaky after cleansing?</label>
                        <label class="radio-option">
                            <input type="radio" name="dryness" value="yes" required>
                            <span>✅ Yes, frequently</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="dryness" value="no">
                            <span>❌ No, feels comfortable</span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label class="question-label"><i class="fas fa-heartbeat" style="color:#ff9a9e;"></i> Does your skin get red, irritated, or react to products easily?</label>
                        <label class="radio-option">
                            <input type="radio" name="sensitivity" value="yes" required>
                            <span>✅ Yes, it's sensitive</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="sensitivity" value="no">
                            <span>❌ No, it's tolerant</span>
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-magic"></i> Discover My Skin Type
                    </button>
                </form>
            </div>

            {% if result %}
            <div class="result-section">
                <h2><i class="fas fa-trophy"></i> Analysis Complete!</h2>
                <div class="result-skin-type">{{ result|safe }}</div>
                <a href="/" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Get My Personalized Routine
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
