<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Type Quiz - GlowAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; 
        }
        .container {
            max-width: 600px; margin: 0 auto; padding: 20px;
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center;
        }
        .quiz-container {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            border-radius: 30px; padding: 50px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .quiz-title {
            text-align: center; color: #333; margin-bottom: 40px;
        }
        .quiz-title h1 {
            font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; color: #764ba2;
        }
        .quiz-title p {
            font-size: 1.1rem; color: #666; font-weight: 300;
        }
        .form-group { margin-bottom: 30px; }
        .form-group label {
            display: block; font-weight: 600; color: #555; margin-bottom: 15px; font-size: 1.2rem;
        }
        .radio-option {
            display: flex; align-items: center; gap: 15px; padding: 20px;
            background: #f8f9ff; border: 2px solid #e8e8e8; border-radius: 15px;
            cursor: pointer; transition: all 0.3s ease; margin-bottom: 10px;
            font-family: 'Poppins', sans-serif;
        }
        .radio-option:hover {
            border-color: #667eea; background: #f0f4ff; transform: translateX(5px);
        }
        .radio-option input[type="radio"] {
            width: 20px; height: 20px; accent-color: #667eea; cursor: pointer;
            transform: scale(1.2);
        }
        .radio-option.selected {
            border-color: #667eea; background: #e8f0fe; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .submit-btn {
            width: 100%; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 25px; font-size: 1.2rem; font-weight: 600;
            font-family: 'Poppins', sans-serif; cursor: pointer; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 20px;
        }
        .submit-btn:hover {
            transform: translateY(-3px); box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }
        .result-section {
            margin-top: 30px; padding: 30px; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 25px; text-align: center; animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-section h2 {
            font-size: 1.8rem; margin-bottom: 20px; color: #764ba2;
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .result-skin-type {
            font-size: 2rem; font-weight: 700; color: #333; margin: 20px 0;
            padding: 20px; background: rgba(255,255,255,0.8); border-radius: 20px;
            border: 3px solid rgba(118, 75, 162, 0.3);
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.9); color: #667eea; padding: 15px 30px;
            border-radius: 25px; text-decoration: none; font-weight: 600;
            transition: all 0.3s ease; border: 2px solid #667eea; margin-top: 20px;
        }
        .back-btn:hover {
            background: #667eea; color: white; transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        .form-wrapper {
            transition: all 0.5s ease;
        }
        .has-results .form-wrapper {
            display: none;
        }
        .has-results .quiz-title {
            display: none;
        }
        @media (max-width: 768px) {
            .quiz-container { padding: 30px 20px; margin: 20px; }
            .quiz-title h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quiz-container {% if result %}has-results{% endif %}">
            <div class="quiz-title">
                <h1><i class="fas fa-dna"></i> Skin Type Quiz</h1>
                <p>Answer these 3 quick questions to discover your skin type!</p>
            </div>

            <div class="form-wrapper">
                <form method="POST">
                    <div class="form-group">
                        <label><i class="fas fa-oil-can"></i> Does your skin feel oily or shiny, especially in the T-zone (forehead, nose, chin)?</label>
                        <label class="radio-option">
                            <input type="radio" name="oiliness" value="yes" required>
                            <span>✅ Yes, often</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="oiliness" value="no">
                            <span>❌ No, usually not</span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-snowflake"></i> Does your skin feel tight, dry, or flaky after cleansing?</label>
                        <label class="radio-option">
                            <input type="radio" name="dryness" value="yes" required>
                            <span>✅ Yes, frequently</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="dryness" value="no">
                            <span>❌ No, feels comfortable</span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-heartbeat"></i> Does your skin get red, irritated, or react to products easily?</label>
                        <label class="radio-option">
                            <input type="radio" name="sensitivity" value="yes" required>
                            <span>✅ Yes, it's sensitive</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="sensitivity" value="no">
                            <span>❌ No, it's tolerant</span>
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-magic"></i> Discover My Skin Type
                    </button>
                </form>
            </div>

            {% if result %}
            <div class="result-section">
                <h2><i class="fas fa-trophy"></i> Analysis Complete!</h2>
                <div class="result-skin-type">{{ result|safe }}</div>
                <a href="/" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Get My Personalized Routine
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
